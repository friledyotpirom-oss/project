
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แนะนำตัว - ธีรโชติ</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #111827);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 25px;
            padding: 40px;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 40px rgba(99, 102, 241, 0.15);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-icon {
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #06b6d4);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.4);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .subtitle {
            color: #a5b4fc;
            font-size: 16px;
        }

        .info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .card {
            background: rgba(255, 255, 255, 0.07);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            background: rgba(99, 102, 241, 0.15);
        }

        .card h3 {
            color: #93c5fd;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 17px;
        }

        .hobby {
            margin-top: 25px;
        }

        .hobby h2 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #c4b5fd;
        }

        .hobby-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .hobby-item {
            padding: 10px 16px;
            border-radius: 30px;
            background: linear-gradient(135deg, #4338ca, #0891b2);
            font-size: 14px;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #94a3b8;
            font-size: 13px;
        }

        @media (max-width: 500px) {
            .container {
                padding: 25px;
            }

            .info {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <div class="profile-icon">👨🏻‍💻</div>
            <h1>แนะนำตัว</h1>
            <p class="subtitle">Welcome to my personal profile</p>
        </div>

        <div class="info">

            <div class="card">
                <h3>👤 ชื่อ</h3>
                <p>ธีรโชติ</p>
            </div>

            <div class="card">
                <h3>📝 นามสกุล</h3>
                <p>ยศภิรมย์</p>
            </div>

            <div class="card">
                <h3>✨ ชื่อเล่น</h3>
                <p>ฟิว</p>
            </div>

            <div class="card">
                <h3>🎓 แผนก</h3>
                <p>สารสนเทศ</p>
            </div>

            <div class="card">
                <h3>🏫 ระดับชั้น</h3>
                <p>ปวส. 2/1</p>
            </div>

            <div class="card">
                <h3>💻 ความสนใจ</h3>
                <p>เทคโนโลยีและคอมพิวเตอร์</p>
            </div>

        </div>

        <div class="hobby">
            <h2>🎮 งานอดิเรก</h2>

            <div class="hobby-list">
                <div class="hobby-item">🎮 เล่นเกม</div>
                <div class="hobby-item">🎬 ดูอนิเมะ</div>
                <div class="hobby-item">💪 ออกกำลังกาย</div>
            </div>
        </div>

        <div class="footer">
            <p>Thank you for visiting my profile ✨</p>
        </div>

    </div>

</body>
</html>
